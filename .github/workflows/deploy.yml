name: Build & Deploy Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "TunGuard release version"
        required: true
        type: string

  repository_dispatch:
    types:
      - release

permissions:
  contents: write

jobs:
  docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get release version
        id: release
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EVENT_VERSION" ]; then
            VERSION="$EVENT_VERSION"
          else
            VERSION="$INPUT_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Git User
        run: |
          git config --global user.name "Frost-bit-star"
          git config --global user.email "morganmilstone983@gmail.com"

      - name: Sync gh-pages
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages
          fi

      - name: Deploy Documentation
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release detected: $VERSION"

            MINOR_VERSION=$(echo "$VERSION" | cut -d. -f1,2)

            mike deploy \
              --push \
              --update-aliases \
              "$MINOR_VERSION" latest

          else
            echo "Pre-release detected: $VERSION"

            mike deploy \
              --push \
              "$VERSION"
          fi
