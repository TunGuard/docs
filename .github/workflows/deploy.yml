name: Build & Deploy Docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "TunGuard release version"
        required: true
        type: string

  repository_dispatch:
    types:
      - release

permissions:
  contents: write

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get release version
        id: release
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$EVENT_VERSION" ]; then
            VERSION="$EVENT_VERSION"
          else
            VERSION="$INPUT_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            MINOR_VERSION=$(echo "$VERSION" | cut -d. -f1,2)
          else
            MINOR_VERSION="$VERSION"
          fi

          echo "minor_version=$MINOR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync changelog
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Prefer the changelog as it stood at the release tag, falling back to
          # the default branch if the tag (or file) cannot be fetched.
          if ! python scripts/sync_changelog.py --ref "$VERSION"; then
            echo "::warning::Could not fetch CHANGELOG.md at $VERSION, using main"
            python scripts/sync_changelog.py --ref main
          fi

      - name: Build translated sites
        run: |
          # English is built by mike (see below); French and Spanish are built
          # here and merged into the version directory before it is published.
          zensical build --clean --strict --config-file zensical.fr.toml
          zensical build --clean --strict --config-file zensical.es.toml

      - name: Setup Git User
        run: |
          git config --global user.name "Frost-bit-star"
          git config --global user.email "morganmilstone983@gmail.com"

      - name: Sync gh-pages
        run: |
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git branch -f gh-pages origin/gh-pages
          fi

      - name: Deploy Documentation with Mike
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MINOR_VERSION: ${{ steps.release.outputs.minor_version }}
        run: |
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release detected: $VERSION"
            echo "Documentation directory: $MINOR_VERSION"

            mike deploy \
              --push \
              --update-aliases \
              "$MINOR_VERSION" latest
          else
            echo "Pre-release detected: $VERSION"

            mike deploy \
              --push \
              "$VERSION"
          fi

      - name: Checkout generated site
        run: |
          git fetch origin gh-pages
          # The synced changelog leaves local changes in content/; they were
          # already built, so force the switch to the deployed branch.
          git checkout -f -B pages-site origin/gh-pages

      - name: Merge translated sites
        env:
          MINOR_VERSION: ${{ steps.release.outputs.minor_version }}
        run: |
          # English is published at the site root; French and Spanish go under
          # their own language subdirectories.
          if [ -d "site-fr" ]; then
            mkdir -p "$MINOR_VERSION/fr"
            cp -r site-fr/. "$MINOR_VERSION/fr/"
          fi

          if [ -d "site-es" ]; then
            mkdir -p "$MINOR_VERSION/es"
            cp -r site-es/. "$MINOR_VERSION/es/"
          fi

      - name: Verify generated documentation
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MINOR_VERSION: ${{ steps.release.outputs.minor_version }}
        run: |
          echo "gh-pages contents:"
          ls -la

          echo ""
          echo "Version directory:"
          ls -la "$MINOR_VERSION"

          echo ""
          echo "Language directories:"
          ls -la "$MINOR_VERSION/fr"
          ls -la "$MINOR_VERSION/es"

          echo ""
          echo "Indexes:"
          ls -la "$MINOR_VERSION/index.html"
          ls -la "$MINOR_VERSION/fr/index.html"
          ls -la "$MINOR_VERSION/es/index.html"
          ls -la "$MINOR_VERSION/changelog/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./${{ steps.release.outputs.minor_version }}

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
